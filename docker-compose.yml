version: '3.8'

services:
  moderateur-service:
    build: .
    container_name: microservice_moderateur
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=default
    networks:
      - melodyme-net

  postgres:
    image: postgres
    container_name: db_M_moderateur
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: db_moderateur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - melodyme-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper_M_moderateur
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - melodyme-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka_M_moderateur
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_M_moderateur:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_M_moderateur:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - melodyme-net

volumes:
  pgdata:

networks:
  melodyme-net:
